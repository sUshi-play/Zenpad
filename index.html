<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZenPad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Caveat:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#9b6080;}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-family:'Noto Serif JP',serif;user-select:none;overflow:hidden;touch-action:none;}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
#rippleCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
#pathCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;}
#pulse-ring{position:absolute;z-index:8;width:150px;height:150px;border-radius:50%;border:2px solid transparent;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
#pulse-ring.active{border-color:rgba(255,200,210,0.85);box-shadow:0 0 24px rgba(255,160,180,0.4),inset 0 0 20px rgba(255,160,180,0.15);animation:pulseRing 0.9s ease-in-out infinite;}
@keyframes pulseRing{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.13);opacity:0.65}}
#topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
#title-txt{font-size:11px;letter-spacing:0.38em;text-transform:uppercase;color:rgba(255,230,240,0.4);font-weight:300;}
#lives{font-size:16px;letter-spacing:3px;color:rgba(255,220,230,0.75);}
#exit-btn{pointer-events:all;background:transparent;border:1px solid rgba(255,180,200,0.35);color:rgba(255,200,220,0.6);font-family:'Caveat',cursive;font-size:12px;letter-spacing:0.2em;padding:5px 14px;cursor:pointer;border-radius:2px;transition:all 0.25s;-webkit-tap-highlight-color:transparent;}
#exit-btn:active{background:rgba(200,50,80,0.2);border-color:rgba(255,100,130,0.7);color:#fff;}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;}
#player-name-display{font-size:12px;letter-spacing:0.2em;color:rgba(255,210,230,0.5);font-family:'Caveat',cursive;text-align:center;}
#score-label{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,220,235,0.4);font-family:'Caveat',cursive;text-align:center;}
#score{font-size:68px;line-height:1;color:#fff5f8;font-weight:300;text-shadow:0 0 40px rgba(255,150,180,0.5);text-align:center;}
#combo{font-size:13px;letter-spacing:0.2em;color:#ffb8ce;font-family:'Caveat',cursive;min-height:20px;transition:opacity 0.3s;opacity:0;text-align:center;}
#challenge-wrap{position:absolute;z-index:10;bottom:68px;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;}
#challenge-text{font-size:14px;letter-spacing:0.15em;color:rgba(255,230,240,0.75);font-family:'Caveat',cursive;text-align:center;}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,220,235,0.2);z-index:10;pointer-events:none;font-family:'Caveat',cursive;}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-5px,2px)}60%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}
.shaking{animation:shake 0.45s ease-out;}
@keyframes scorePop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.score-pop{animation:scorePop 0.2s ease-out;}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at center,rgba(100,25,50,0.88) 0%,rgba(55,8,22,0.97) 100%);backdrop-filter:blur(7px);transition:opacity 0.5s;}
.screen.hidden{opacity:0;pointer-events:none;}
.screen h1{font-size:46px;font-weight:300;color:#fff0f5;letter-spacing:0.1em;text-shadow:0 0 50px rgba(255,140,175,0.35);}
.screen .sub{font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(255,200,220,0.3);}
.screen p{font-size:13px;letter-spacing:0.12em;color:rgba(255,215,230,0.52);text-align:center;max-width:300px;line-height:1.9;}
.btn{padding:11px 36px;background:transparent;border:1px solid rgba(255,150,180,0.45);color:#ffb8ce;font-family:'Noto Serif JP',serif;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;cursor:pointer;transition:all 0.3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.btn:active{background:rgba(255,150,180,0.12);border-color:rgba(255,150,180,0.9);}
#name-input{font-size:22px;background:transparent;border:none;border-bottom:1px solid rgba(255,180,200,0.5);color:#fff0f5;text-align:center;font-family:'Caveat',cursive;letter-spacing:0.15em;outline:none;padding:6px 12px;width:220px;-webkit-appearance:none;}
#name-input::placeholder{color:rgba(255,200,220,0.3);}
#leaderboard-list{width:280px;max-height:240px;overflow-y:auto;}
#leaderboard-list::-webkit-scrollbar{width:3px;}
#leaderboard-list::-webkit-scrollbar-thumb{background:rgba(255,150,180,0.3);}
.lb-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,180,200,0.1);}
.lb-rank{font-size:11px;color:rgba(255,180,200,0.4);font-family:'Caveat',cursive;width:22px;text-align:right;flex-shrink:0;}
.lb-name{flex:1;font-size:15px;color:rgba(255,230,240,0.8);font-family:'Caveat',cursive;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-size:15px;color:#ffb8ce;font-family:'Caveat',cursive;flex-shrink:0;}
.lb-you{color:#fff;text-shadow:0 0 12px rgba(255,150,180,0.7);}
#finalScore{font-size:72px;font-weight:300;color:#ffb8ce;line-height:1;}
</style>
</head>
<body>
<div id="app">
  <canvas id="bgCanvas"></canvas>
  <canvas id="rippleCanvas"></canvas>
  <canvas id="pathCanvas"></canvas>
  <div id="pulse-ring"></div>
  <div id="topbar">
    <div id="title-txt">ZenPad</div>
    <div id="lives">♦ ♦ ♦</div>
    <button id="exit-btn">Exit</button>
  </div>
  <div id="ui">
    <div id="player-name-display"></div>
    <div><div id="score-label">score</div><div id="score">0</div></div>
    <div id="combo"></div>
  </div>
  <div id="challenge-wrap"><div id="challenge-text"></div></div>
  <div id="hint">two fingers on trackpad · touch on mobile</div>

  <div class="screen" id="nameScreen">
    <div class="sub">welcome</div>
    <h1>ZenPad</h1>
    <p>Follow the rhythm · Trace the path · Touch the light.</p>
    <input id="name-input" type="text" maxlength="18" placeholder="your name" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn" id="nameStartBtn">Begin</button>
    <div style="font-size:10px;letter-spacing:0.25em;color:rgba(255,200,220,0.28);font-family:Caveat,cursive;text-transform:uppercase;margin-top:-8px">🔊 tap begin to enable sound</div>
  </div>

  <div class="screen hidden" id="endScreen">
    <div class="sub">session complete</div>
    <h1>ZenPad</h1>
    <div id="finalScore">0</div>
    <p id="end-msg">still waters, open hands</p>
    <div id="leaderboard-list"></div>
    <button class="btn" id="playAgainBtn">Play Again</button>
  </div>
</div>

document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

document.addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','PageUp','PageDown'].includes(e.key))e.preventDefault();});

let waveT=0,waveAmt=0;
function resize(){W=bgC.width=ripC.width=pathC.width=window.innerWidth;H=bgC.height=ripC.height=pathC.height=window.innerHeight;}
window.addEventListener('resize',resize);

function drawBg(){
  if(!bgImg.complete||!bgImg.naturalWidth)return;
  bgCtx.clearRect(0,0,W,H);
  const iw=bgImg.naturalWidth,ih=bgImg.naturalHeight;
  const sc=Math.max(W/iw,H/ih);
  const dw=iw*sc,dh=ih*sc,ox=(W-dw)/2,oy=(H-dh)/2;
  const amp=waveAmt*20;
  if(amp<0.8){bgCtx.drawImage(bgImg,ox,oy,dw,dh);}
  else{
    const sh=3;
    for(let y=0;y<H;y+=sh){
      const off=amp*Math.sin(y*0.022+waveT)*Math.cos(y*0.011+waveT*0.6);
      const sy=(y-oy)/sc,ssh=sh/sc;
      if(sy<0||sy+ssh>ih)continue;
      bgCtx.drawImage(bgImg,0,sy,iw,ssh,ox+off,y,dw,sh);
    }
  }
  const v=bgCtx.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.72);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(40,5,15,0.5)');
  bgCtx.fillStyle=v;bgCtx.fillRect(0,0,W,H);
}

// ── Ripples ────────────────────────────────────────────────────────────────
const ripples=[];
function addRipple(x,y,c='rgba(255,180,200,0.55)',s=45){ripples.push({x,y,r:4,alpha:0.75,color:c,maxR:s});}
function updateRipples(){
  ripCtx.clearRect(0,0,W,H);
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=2;r.alpha-=0.014;
    if(r.alpha<=0){ripples.splice(i,1);continue;}
    ripCtx.save();
    ripCtx.beginPath();ripCtx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ripCtx.strokeStyle=r.color;ripCtx.globalAlpha=r.alpha;ripCtx.lineWidth=1.8;ripCtx.stroke();
    if(r.r>12){ripCtx.beginPath();ripCtx.arc(r.x,r.y,r.r*0.55,0,Math.PI*2);ripCtx.globalAlpha=r.alpha*0.35;ripCtx.stroke();}
    ripCtx.restore();
  }
}

// ── Audio — iOS-safe ───────────────────────────────────────────────────────
// Strategy: create AudioContext on first direct tap, play a silent buffer immediately,
// then all subsequent sounds use the same context which stays unlocked.
let AC = null;

function initAudio(){
  try {
    if(!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
    }
    // Always try to resume — iOS suspends it even after creation
    AC.resume().then(()=>{
      // Play a silent buffer AFTER resume — confirms unlock on iOS
      const buf = AC.createBuffer(1, AC.sampleRate * 0.1, AC.sampleRate);
      const src = AC.createBufferSource();
      src.buffer = buf;
      src.connect(AC.destination);
      src.start(0);
    });
  } catch(e){ AC = null; }
}

// Also re-resume on any touch in case iOS suspends mid-game
document.addEventListener('touchend',()=>{
  if(AC && AC.state==='suspended') AC.resume();
},{passive:true});

// Sigh synthesizer — uses oscillators + filters, no buffer needed, works on iOS
// intensity 0..1, pitch modifier, duration
function playSigh(intensity, pitchBase, dur){
  if(!AC) return;
  if(AC.state === 'suspended') AC.resume();
  const now = AC.currentTime;

  // Master gain
  const masterGain = AC.createGain();
  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(intensity * 0.4, now + dur * 0.15);
  masterGain.gain.setValueAtTime(intensity * 0.4, now + dur * 0.6);
  masterGain.gain.linearRampToValueAtTime(0, now + dur);
  masterGain.connect(AC.destination);

  // Breath noise via multiple detuned oscillators + bandpass — sounds breath-like
  const freqs = [pitchBase, pitchBase*1.5, pitchBase*2.1, pitchBase*2.8, pitchBase*3.7];
  freqs.forEach((f, i) => {
    const osc = AC.createOscillator();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(f + (Math.random()-0.5)*f*0.08, now);
    osc.frequency.linearRampToValueAtTime(f * (0.95 + Math.random()*0.1), now + dur);

    const g = AC.createGain();
    g.gain.setValueAtTime(0.12 / freqs.length, now);
    g.gain.setValueAtTime(0.18 / freqs.length, now + dur * 0.3);
    g.gain.linearRampToValueAtTime(0, now + dur);

    osc.connect(g); g.connect(masterGain);
    osc.start(now); osc.stop(now + dur + 0.05);
  });

  // Add a soft bandpass filtered noise layer for breathiness
  try {
    const nBuf = AC.createBuffer(1, AC.sampleRate * (dur + 0.1), AC.sampleRate);
    const nd = nBuf.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    const nSrc = AC.createBufferSource();
    nSrc.buffer = nBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(pitchBase * 4, now);
    bp.frequency.linearRampToValueAtTime(pitchBase * 2.5, now + dur);
    bp.Q.value = 2.5;
    const ng = AC.createGain();
    ng.gain.setValueAtTime(0, now);
    ng.gain.linearRampToValueAtTime(intensity * 0.15, now + dur * 0.1);
    ng.gain.setValueAtTime(intensity * 0.15, now + dur * 0.7);
    ng.gain.linearRampToValueAtTime(0, now + dur);
    nSrc.connect(bp); bp.connect(ng); ng.connect(AC.destination);
    nSrc.start(now);
  } catch(e){}
}

// Small sigh — hitting a zone or path point (intensity varies with combo)
function sighSmall(intensity){
  const pitch = 220 + intensity * 80; // 220–300 Hz — soft feminine register
  playSigh(intensity, pitch, 0.6 + intensity * 0.4);
}

// Medium sigh — completing a challenge
function sighMedium(){
  playSigh(0.7, 260, 1.2);
  setTimeout(()=>playSigh(0.4, 300, 0.8), 400);
}

// Great sigh — exit or game end
function sighGreat(){
  playSigh(0.9, 240, 1.8);
  setTimeout(()=>playSigh(0.65, 290, 1.4), 500);
  setTimeout(()=>playSigh(0.4, 320, 1.0), 1100);
}

// Wrong sound — sharp dissonant drop
function sighWrong(){
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  const now = AC.currentTime;
  const osc = AC.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.25, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 1.5;
  osc.connect(bp); bp.connect(g); g.connect(AC.destination);
  osc.start(now); osc.stop(now + 0.5);
}

// ── Leaderboard ────────────────────────────────────────────────────────────
function loadScores(){try{return JSON.parse(localStorage.getItem('zenpad_scores')||'[]');}catch(e){return[];}}
function saveScore(name,s){
  const sc=loadScores();
  sc.push({name,score:s});
  sc.sort((a,b)=>b.score-a.score);
  sc.splice(10);
  try{localStorage.setItem('zenpad_scores',JSON.stringify(sc));}catch(e){}
  return sc;
}
function renderLeaderboard(hlName,hlScore){
  const sc=loadScores();
  const el=document.getElementById('leaderboard-list');
  if(!sc.length){el.innerHTML='<div style="color:rgba(255,200,220,0.3);font-family:Caveat,cursive;font-size:13px;text-align:center;padding:12px">no scores yet</div>';return;}
  const ranks=['🥇','🥈','🥉'];
  el.innerHTML=sc.map((s,i)=>{
    const you=s.name===hlName&&s.score===hlScore;
    return`<div class="lb-row">
      <div class="lb-rank">${ranks[i]||i+1}</div>
      <div class="lb-name ${you?'lb-you':''}">${s.name}${you?' ◀':''}</div>
      <div class="lb-score ${you?'lb-you':''}">${s.score}</div>
    </div>`;
  }).join('');
}

// ── Game state ─────────────────────────────────────────────────────────────
let score=0,combo=0,lives=3,gameActive=false,playerName='';
let currentChallenge=null,challengeTimer=null;
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo');
const livesEl=document.getElementById('lives'),challengeTextEl=document.getElementById('challenge-text');
const pulseRing=document.getElementById('pulse-ring');
let vx=null,vy=null,lastX=null,lastY=null;

function addScore(pts,x,y){
  const mult=1+Math.floor(combo/3);
  score+=pts*mult;
  scoreEl.textContent=score;
  scoreEl.classList.remove('score-pop');void scoreEl.offsetWidth;scoreEl.classList.add('score-pop');
  combo++;
  if(combo>=3){comboEl.textContent='✦ '+combo+'x combo';comboEl.style.opacity='1';}
  // Sigh intensity based on combo
  const intensity=Math.min(1, 0.3 + combo*0.07);
  sighSmall(intensity);
  if(x!==undefined) addRipple(x,y,'rgba(255,175,205,0.55)',35+intensity*30);
}

function loseLife(){
  if(!gameActive)return;
  lives--;combo=0;comboEl.style.opacity='0';
  livesEl.textContent=['♦','♦','♦'].map((_,i)=>i<lives?'♦':'◇').join(' ');
  sighWrong();
  const app=document.getElementById('app');
  app.classList.remove('shaking');void app.offsetWidth;app.classList.add('shaking');
  const fl=document.createElement('div');
  Object.assign(fl.style,{position:'fixed',inset:'0',background:'rgba(200,40,70,0.22)',zIndex:'15',pointerEvents:'none',transition:'opacity 0.5s'});
  document.body.appendChild(fl);
  setTimeout(()=>{fl.style.opacity='0';setTimeout(()=>fl.remove(),500);},120);
  if(lives<=0)endGame();
}

function exitGame(){
  if(!gameActive)return;
  gameActive=false;
  clearChallenge();
  sighGreat();
  setTimeout(()=>showEndScreen('you left — but what a ride'),800);
}

// ── Challenges ─────────────────────────────────────────────────────────────
const TYPES=['rhythm','path','zone','path','rhythm','zone'];
let challengeIndex=0;
let rhythmInterval=null,rhythmWindow=false,rhythmCount=0;
let pathPoints=[],pathProgress=0,pathScored=false,pathShape=0;
let zoneList=[],zonesHit=0,zoneAnimFrame=null;

function nextChallenge(){
  if(!gameActive)return;
  clearChallenge();
  const type=TYPES[challengeIndex%TYPES.length];challengeIndex++;
  setTimeout(()=>{if(gameActive)startChallenge(type);},600);
}
function clearChallenge(){
  if(challengeTimer)clearTimeout(challengeTimer);
  if(rhythmInterval)clearInterval(rhythmInterval);
  if(zoneAnimFrame)cancelAnimationFrame(zoneAnimFrame);
  pulseRing.classList.remove('active');
  zoneList.length=0;pathCtx.clearRect(0,0,W,H);
  challengeTextEl.textContent='';currentChallenge=null;
}

// Rhythm
function startRhythm(){
  currentChallenge={type:'rhythm'};rhythmCount=0;
  challengeTextEl.textContent='rub in rhythm with the pulse';
  pulseRing.classList.add('active');
  const iv=860;
  rhythmInterval=setInterval(()=>{
    if(!gameActive){clearInterval(rhythmInterval);return;}
    rhythmWindow=true;setTimeout(()=>{rhythmWindow=false;},iv*0.42);
  },iv);
  challengeTimer=setTimeout(()=>{clearInterval(rhythmInterval);if(rhythmCount<4)loseLife();nextChallenge();},iv*9);
}
function checkRhythmHit(){
  if(!rhythmWindow||currentChallenge?.type!=='rhythm')return;
  rhythmWindow=false;rhythmCount++;
  addScore(15,W/2,H/2);
  addRipple(W/2,H/2,'rgba(255,180,200,0.7)',75);
  if(rhythmCount>=4){clearInterval(rhythmInterval);clearTimeout(challengeTimer);sighMedium();nextChallenge();}
}

// Path — 4 distinct shapes
function generatePath(shape){
  const pts=[];
  if(shape===0){
    // Wide sine wave left to right
    for(let i=0;i<=9;i++){const t=i/9;pts.push({x:W*0.06+t*W*0.88,y:H*0.5+Math.sin(t*Math.PI*2.5)*H*0.22});}
  } else if(shape===1){
    // Deep U curve
    pts.push({x:W*0.12,y:H*0.22});pts.push({x:W*0.14,y:H*0.52});
    pts.push({x:W*0.25,y:H*0.78});pts.push({x:W*0.5,y:H*0.86});
    pts.push({x:W*0.75,y:H*0.78});pts.push({x:W*0.86,y:H*0.52});
    pts.push({x:W*0.88,y:H*0.22});
  } else if(shape===2){
    // Zigzag across screen
    const z=[[0.08,0.28],[0.22,0.72],[0.36,0.26],[0.50,0.74],[0.64,0.28],[0.78,0.72],[0.92,0.30]];
    z.forEach(([x,y])=>pts.push({x:W*x,y:H*y}));
  } else {
    // Diagonal S-curve top-left to bottom-right
    for(let i=0;i<=8;i++){const t=i/8;pts.push({x:W*0.1+t*W*0.8,y:H*0.15+t*H*0.7+Math.sin(t*Math.PI*2.2)*H*0.2});}
  }
  return pts.map((p,i)=>i===0||i===pts.length-1?p:{x:p.x+(Math.random()-.5)*W*0.03,y:p.y+(Math.random()-.5)*H*0.03});
}

function drawTargetPath(pts,progress=0){
  pathCtx.clearRect(0,0,W,H);
  if(pts.length<2)return;
  pathCtx.save();pathCtx.setLineDash([12,7]);
  pathCtx.beginPath();pathCtx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)pathCtx.lineTo(pts[i].x,pts[i].y);
  pathCtx.strokeStyle='rgba(255,180,210,0.3)';pathCtx.lineWidth=3;pathCtx.lineCap='round';pathCtx.lineJoin='round';pathCtx.stroke();
  pathCtx.restore();
  if(progress>0){
    const end=Math.min(pts.length-1,Math.floor(progress*(pts.length-1))+1);
    pathCtx.save();pathCtx.setLineDash([]);
    pathCtx.beginPath();pathCtx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<=end;i++)pathCtx.lineTo(pts[i].x,pts[i].y);
    pathCtx.strokeStyle='rgba(255,190,215,0.95)';pathCtx.lineWidth=4.5;pathCtx.lineCap='round';pathCtx.lineJoin='round';
    pathCtx.shadowColor='rgba(255,140,185,0.65)';pathCtx.shadowBlur=16;pathCtx.stroke();pathCtx.restore();
  }
  pathCtx.save();
  pathCtx.beginPath();pathCtx.arc(pts[0].x,pts[0].y,9,0,Math.PI*2);
  pathCtx.fillStyle='rgba(255,185,215,0.9)';pathCtx.shadowColor='rgba(255,140,185,0.7)';pathCtx.shadowBlur=16;pathCtx.fill();
  pathCtx.beginPath();pathCtx.arc(pts[pts.length-1].x,pts[pts.length-1].y,7,0,Math.PI*2);
  pathCtx.fillStyle='rgba(255,185,215,0.4)';pathCtx.shadowBlur=10;pathCtx.fill();
  pathCtx.restore();
}

function startPath(){
  currentChallenge={type:'path'};
  pathShape=(pathShape+1)%4;
  pathPoints=generatePath(pathShape);pathProgress=0;pathScored=false;
  const labels=['follow the wave','trace the curve','follow the zigzag','trace the S'];
  challengeTextEl.textContent=labels[pathShape];
  drawTargetPath(pathPoints,0);
  vx=pathPoints[0].x;vy=pathPoints[0].y;lastX=null;lastY=null;
  challengeTimer=setTimeout(()=>{if(pathProgress<0.75)loseLife();nextChallenge();},12000);
}
function checkPathProgress(x,y){
  if(currentChallenge?.type!=='path')return;
  const seg=Math.floor(pathProgress*(pathPoints.length-1));
  if(seg>=pathPoints.length-1)return;
  const t=pathPoints[seg+1];
  if(Math.hypot(x-t.x,y-t.y)<75){
    pathProgress=(seg+1)/(pathPoints.length-1);
    drawTargetPath(pathPoints,pathProgress);
    addScore(12,t.x,t.y);
    if(pathProgress>=1&&!pathScored){pathScored=true;clearTimeout(challengeTimer);sighMedium();nextChallenge();}
  }
}

// Zone
function startZone(){
  currentChallenge={type:'zone'};zonesHit=0;zoneList=[];
  challengeTextEl.textContent='rub the glowing circles';
  for(let i=0;i<4;i++){
    zoneList.push({x:W*0.15+Math.random()*W*0.7,y:H*0.18+Math.random()*H*0.64,r:42+Math.random()*18,active:false,hit:false});
    setTimeout(()=>{if(currentChallenge?.type==='zone')zoneList[i].active=true;},i*1250);
  }
  (function loop(){
    if(currentChallenge?.type!=='zone')return;
    pathCtx.clearRect(0,0,W,H);
    zoneList.forEach(z=>{
      if(!z.active||z.hit)return;
      const p=0.76+0.24*Math.sin(Date.now()*0.005);
      pathCtx.save();
      pathCtx.beginPath();pathCtx.arc(z.x,z.y,z.r*p,0,Math.PI*2);
      pathCtx.strokeStyle='rgba(255,160,195,0.82)';pathCtx.lineWidth=2.5;
      pathCtx.shadowColor='rgba(255,110,165,0.6)';pathCtx.shadowBlur=22;pathCtx.stroke();
      pathCtx.beginPath();pathCtx.arc(z.x,z.y,z.r*0.38,0,Math.PI*2);
      pathCtx.fillStyle='rgba(255,160,195,0.13)';pathCtx.fill();
      pathCtx.restore();
    });
    zoneAnimFrame=requestAnimationFrame(loop);
  })();
  challengeTimer=setTimeout(()=>{
    cancelAnimationFrame(zoneAnimFrame);
    if(zoneList.filter(z=>z.active&&!z.hit).length>1)loseLife();
    nextChallenge();
  },4*1250+2400);
}
function checkZoneHit(x,y){
  if(currentChallenge?.type!=='zone')return;
  zoneList.forEach(z=>{
    if(!z.active||z.hit)return;
    if(Math.hypot(x-z.x,y-z.y)<z.r+14){
      z.hit=true;zonesHit++;
      addScore(22,z.x,z.y);
      if(zonesHit>=zoneList.length){clearTimeout(challengeTimer);cancelAnimationFrame(zoneAnimFrame);sighMedium();nextChallenge();}
    }
  });
}
function startChallenge(t){if(t==='rhythm')startRhythm();else if(t==='path')startPath();else startZone();}

// ── Input ──────────────────────────────────────────────────────────────────
document.addEventListener('wheel',e=>{
  if(!gameActive)return;
  waveAmt=Math.min(1,waveAmt+0.18);
  if(vx===null){vx=W/2;vy=H/2;}
  const nx=Math.max(25,Math.min(W-25,vx+e.deltaX*0.88));
  const ny=Math.max(25,Math.min(H-25,vy+e.deltaY*0.88));
  const speed=Math.hypot(e.deltaX,e.deltaY);
  if(speed>3)addRipple(nx,ny,'rgba(255,175,205,0.4)',18+speed*0.3);
  if(speed>4){checkRhythmHit();checkPathProgress(nx,ny);checkZoneHit(nx,ny);}
  lastX=vx;lastY=vy;vx=nx;vy=ny;
},{passive:false});

let touchLast={x:null,y:null};
document.addEventListener('touchstart',e=>{
  if(!gameActive||e.touches.length<2)return;
  touchLast={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!gameActive||e.touches.length<2)return;
  waveAmt=Math.min(1,waveAmt+0.18);
  const x=e.touches[0].clientX,y=e.touches[0].clientY;
  const dx=x-(touchLast.x||x),dy=y-(touchLast.y||y);
  const speed=Math.hypot(dx,dy);
  if(speed>2)addRipple(x,y,'rgba(255,175,205,0.4)',22+speed*0.8);
  if(speed>3){checkRhythmHit();checkPathProgress(x,y);checkZoneHit(x,y);}
  touchLast={x,y};
},{passive:false});

// ── Main loop ──────────────────────────────────────────────────────────────
let lastTS=0;
function loop(ts){
  const dt=(ts-lastTS)/1000;lastTS=ts;
  waveT+=dt*1.3;waveAmt=Math.max(0,waveAmt-dt*2.2);
  drawBg();updateRipples();
  requestAnimationFrame(loop);
}

// ── Game flow ──────────────────────────────────────────────────────────────
function showEndScreen(msg){
  const sc=saveScore(playerName,score);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('end-msg').textContent=msg||'still waters, open hands';
  renderLeaderboard(playerName,score);
  document.getElementById('endScreen').classList.remove('hidden');
}
function startGame(){
  score=0;combo=0;lives=3;challengeIndex=0;gameActive=true;
  pathShape=-1;vx=null;vy=null;lastX=null;lastY=null;waveAmt=0;
  scoreEl.textContent='0';comboEl.style.opacity='0';
  livesEl.textContent='♦ ♦ ♦';
  document.getElementById('player-name-display').textContent=playerName;
  document.getElementById('endScreen').classList.add('hidden');
  nextChallenge();
}
function endGame(){
  gameActive=false;clearChallenge();
  sighGreat();
  setTimeout(()=>showEndScreen(),600);
}

// Wire exit button
document.getElementById('exit-btn').addEventListener('click',exitGame);
document.getElementById('exit-btn').addEventListener('touchend',e=>{e.preventDefault();exitGame();},{passive:false});

// Name screen
// iOS requires AudioContext.resume() in a click or touchend — NOT touchstart with preventDefault
function goFromNameScreen(){
  const n=document.getElementById('name-input').value.trim();
  if(!n)return;
  playerName=n;
  initAudio();
  document.getElementById('nameScreen').classList.add('hidden');
  startGame();
}
const nsb=document.getElementById('nameStartBtn');
// Use touchend (not touchstart) — iOS honours this as a real gesture
nsb.addEventListener('touchend',e=>{e.preventDefault();goFromNameScreen();},{passive:false});
nsb.addEventListener('click',goFromNameScreen);
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')goFromNameScreen();});

// Play again
function goPlayAgain(){
  initAudio();
  document.getElementById('endScreen').classList.add('hidden');
  startGame();
}
const pab=document.getElementById('playAgainBtn');
pab.addEventListener('touchend',e=>{e.preventDefault();goPlayAgain();},{passive:false});
pab.addEventListener('click',goPlayAgain);

resize();
requestAnimationFrame(loop);
</script>
